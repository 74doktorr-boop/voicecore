# ══════════════════════════════════════════════════════════════════════════
# Vigilante EXTERNO de NodeFlow
#
# POR QUÉ: hasta hoy el servicio se vigilaba a sí mismo. La auditoría nocturna
# y el /health corren DENTRO del propio contenedor, así que el único fallo que
# no pueden detectar es justo el que importa: que el contenedor no esté vivo.
# Un vigilante que se apaga con lo vigilado no vigila.
#
# Esto corre en la infraestructura de GitHub, fuera de EasyPanel. Si falla,
# GitHub manda un correo al dueño del repo — sin cuentas nuevas ni secretos.
#
# ── POR QUÉ AHORA MIDE MÁS COSAS (2026-08-01) ────────────────────────────
# El 31/07 saltó dos veces, a las 18:42 y a las 22:17 UTC, y ninguna de las
# dos coincidió con un despliegue. Los dos intentos dieron «HTTP 000» tras
# agotar los 25 segundos enteros de curl. Y ahí se acabó lo que se sabía.
#
# «HTTP 000» no es un diagnóstico, es la ausencia de uno: cabe dentro el DNS
# que no resuelve, el TCP que no conecta, el TLS que se queda a medias, y el
# proceso que acepta la conexión y luego no contesta —que son cuatro averías
# distintas con cuatro culpables distintos—. Una alarma que no dice cuál de
# los cuatro fue obliga a investigar desde cero cada vez, y una alarma que
# cuesta una hora investigar se acaba mirando de reojo.
#
# Ahora cada intento guarda el desglose de tiempos de curl y su código de
# salida, y si falla se pregunta otras dos cosas antes de dar la alarma:
#
#   · ¿Va el internet DEL RUNNER?  → cloudflare.com/cdn-cgi/trace
#   · ¿Va la MÁQUINA de EasyPanel? → ets.nodeflow.es, que es otro contenedor
#     en el mismo servidor (mismo IP, comprobado: 187.124.35.34)
#
# Con eso el correo ya no dice «algo falla», dice cuál de estos tres:
#   A) el contenedor de VoiceCore está colgado  (los dos controles bien)
#   B) el servidor entero o su proxy está caído (falla también ets)
#   C) el runner de GitHub se quedó sin red     (falla también Cloudflare)
#
# El caso C NO tumba el watchdog: es ruido, y un vigilante que grita por el
# ruido enseña a ignorarlo justo antes de la vez que importa.
#
# LÍMITES, que conviene saberlos:
#   · Aquí abajo pide cada 10 minutos, pero GitHub NO lo cumple: medido el
#     31/07, entre ejecución y ejecución pasaron entre 50 y 130 minutos. Los
#     crons de Actions se encolan y se saltan cuando la cola aprieta. O sea
#     que esto detecta una caída en una o dos horas, no en diez minutos, y
#     ve alrededor del 1% del día. Para vigilancia de verdad al minuto hace
#     falta algo como UptimeRobot, que sí necesita darse de alta.
#   · GitHub desactiva los crons de repos sin actividad durante 60 días. Este
#     tiene despliegues casi a diario, pero si algún día para, revisar esto.
# ══════════════════════════════════════════════════════════════════════════
name: Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # para poder probarlo a mano sin esperar al cron

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ¿Está vivo y sano?
        run: |
          set -uo pipefail
          # GitHub arranca esto con `bash -e`, y aquí curl VA a fallar a
          # propósito: es lo que venimos a medir. Con -e puesto, el primer
          # timeout mataría el script en la línea de la asignación y el correo
          # de alarma llegaría vacío — sin el diagnóstico que es todo el
          # sentido de este fichero. El flujo se controla con exit explícitos.
          set +e
          URL="https://nodeflow.es/health"

          # Un intento, con el desglose de dónde se fue el tiempo. Deja el
          # cuerpo en $2 y escribe en la salida una línea legible.
          #
          # OJO con el código de salida de curl: es la mitad del diagnóstico.
          #   6  = el DNS no resuelve         28 = se agotó el tiempo
          #   7  = no se pudo conectar (TCP)  35 = el TLS se rompió
          # Antes esto se perdía —`|| echo "000"` se comía el código y encima
          # dejaba escrito «HTTP 000000», que ni siquiera es un número—.
          probar() {
            local url="$1" cuerpo="$2"
            # Vaciar el fichero ANTES. Probando esto en local salió que, cuando
            # curl no escribe nada, el `cat` de abajo enseñaba el cuerpo del
            # intento ANTERIOR: un {"status":"ok"} sano impreso justo debajo de
            # un fallo. Es la peor mentira posible en un correo de alarma —
            # invita a cerrarlo pensando que fue un falso positivo.
            : > "$cuerpo"
            local fmt='%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}'
            local out rc
            out=$(curl -s -m 25 -o "$cuerpo" -w "$fmt" "$url"); rc=$?
            [ -n "$out" ] || out="000 - - - - -"
            echo "$out $rc"
          }

          # Lee la salida de probar() y la cuenta en cristiano.
          contar() {
            read -r code dns conn tls ttfb total rc <<< "$1"
            echo "   HTTP $code (curl rc=$rc) · dns ${dns}s · conexión ${conn}s · TLS ${tls}s · primer byte ${ttfb}s · total ${total}s"
            case "$rc" in
              0)  ;;
              6)  echo "   → el DNS no resolvió el nombre" ;;
              7)  echo "   → no se pudo abrir la conexión TCP (nadie escuchando, o cortafuegos)" ;;
              28) if [ "$conn" = "0.000000" ] || [ "$conn" = "-" ]; then
                    echo "   → se agotó el tiempo ANTES de conectar: el servidor no acepta conexiones"
                  else
                    echo "   → conectó en ${conn}s y luego NO contestó: el proceso está vivo pero atascado"
                  fi ;;
              35) echo "   → el handshake TLS falló" ;;
              *)  echo "   → curl terminó con código $rc" ;;
            esac
          }

          # Dos intentos separados 30s: un redespliegue o un pico de red no son
          # una caída, y una alarma que salta por eso se acaba ignorando.
          for intento in 1 2; do
            echo "── Intento $intento ──"
            R=$(probar "$URL" /tmp/health.json)
            contar "$R"
            CODE=${R%% *}
            cat /tmp/health.json 2>/dev/null || true
            echo ""

            if [ "$CODE" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              # Vivo. Además, avisar de lo que está mal SIN tumbar el watchdog:
              # esto vigila que responda, no que la config sea perfecta.
              grep -q '"database":"connected"' /tmp/health.json || echo "::warning::la base de datos NO figura conectada"
              grep -q '"telnyxSignature":"enforced"' /tmp/health.json || echo "::warning::la firma de Telnyx no se está exigiendo"
              grep -q '"billingConfig":"ok"'      /tmp/health.json || echo "::error::billingConfig NO está ok — puede haber excedente que se cuenta y no se cobra"
              echo "✅ NodeFlow responde y se declara sano."

              # ── Y SE LEE LA CAJA NEGRA ─────────────────────────────────────
              # Aquí está el cambio que de verdad importa. Este vigilante mira
              # una vez cada hora o dos: ve alrededor del 1% del día, así que
              # una caída de dos minutos a las 04:00 no la ve NUNCA. Las dos del
              # 31/07 se cazaron de milagro.
              #
              # El latido, en cambio, corre dentro del proceso cada 10 segundos
              # y se guarda en Redis, o sea que cubre el 100%. Leerlo aquí
              # convierte este muestreo del 1% en cobertura completa con un par
              # de horas de retraso: aunque la caída ocurra entre dos pasadas,
              # la siguiente encuentra el hueco y lo cuenta.
              #
              # No tumba el watchdog: el servicio está respondiendo AHORA. Va
              # como aviso, que es lo que es.
              echo ""
              echo "── Caja negra (latidos del propio proceso) ──"
              LAT=$(probar "https://nodeflow.es/health/latidos" /tmp/lat.json)
              if [ "${LAT%% *}" = "200" ]; then
                python3 - <<'PY' || echo "   (no se pudo interpretar el informe de latidos)"
          import json, sys
          try:
              # encoding EXPLÍCITO: `open()` a secas usa el del sistema. En el
              # runner de Linux es UTF-8 y saldría bien, así que el fallo no se
              # vería nunca aquí — pero probándolo en Windows salió «aplicaciÃ³n»
              # y no hay motivo para dejar que el informe dependa de en qué
              # máquina corre.
              h = json.load(open('/tmp/lat.json', encoding='utf-8'))
          except Exception as e:
              print(f'   informe ilegible: {e}'); sys.exit(0)
          print(f"   {h.get('latidos', 0)} latidos · {h.get('desde')} → {h.get('hasta')}")
          print(f"   {h.get('resumen')}")
          if not h.get('persistente'):
              print("::warning::los latidos NO son persistentes (sin Redis): no podrán demostrar nada de la próxima caída")
          for g in (h.get('huecos') or [])[-5:]:
              print(f"::error::CAÍDA NO VISTA POR EL VIGILANTE: {g['segundos']}s sin latir hasta {g['hasta']} — {g['veredicto']}")
          for r in (h.get('reinicios') or [])[-5:]:
              print(f"::warning::el proceso reinició a las {r['cuando']}")
          p = h.get('picosDeRetardo') or []
          if p:
              peor = max(x['lagMs'] for x in p)
              print(f"::warning::{len(p)} pico(s) de retardo del bucle de eventos, el peor de {peor} ms — el proceso se atasca a ratos")
          m = h.get('memoriaRssMb')
          if m:
              print(f"   memoria RSS {m['min']}–{m['max']} MB (ahora {m['ultimo']})")
          PY
              else
                echo "   /health/latidos devolvió HTTP ${LAT%% *} — ¿versión anterior desplegada?"
              fi

              # ── ¿Y FUNCIONA EL CANAL DE AVISOS? ────────────────────────────
              # Esto tiene que mirarlo alguien de FUERA, y por el mismo motivo
              # que existe este vigilante: si lo único que te avisaría de un
              # problema es el correo, y lo roto es el correo, no te enteras
              # nunca. Un buzón callado se parece exactamente a que todo va bien.
              #
              # Pasó de verdad: había dos líneas NOTIFY_EMAIL con direcciones
              # distintas, mandaba la última, y la otra llevaba meses sin recibir
              # un solo aviso sin que nadie lo supiera.
              echo ""
              echo "── Canal de avisos ──"
              AVI=$(probar "https://nodeflow.es/health/avisos" /tmp/avi.json)
              if [ "${AVI%% *}" = "200" ]; then
                python3 - <<'PY' || echo "   (no se pudo interpretar el informe de avisos)"
          import json, sys
          try:
              h = json.load(open('/tmp/avi.json', encoding='utf-8'))
          except Exception as e:
              print(f'   informe ilegible: {e}'); sys.exit(0)
          dest = h.get('destinatarios') or []
          print('   los avisos van a: ' + (', '.join(dest) if dest else '¡NADIE!'))
          if not dest:
              print('::error::NOTIFY_EMAIL no tiene ningún destinatario — los avisos de producción no llegan a nadie')
          print(f"   {h.get('resumen')}")
          if not h.get('persistente'):
              print('::warning::el registro de avisos no es persistente (sin Redis)')
          for x in (h.get('noEntregados') or [])[-5:]:
              print(f"::error::AVISO QUE NO LLEGÓ ({x['estado']}): «{x['asunto']}» a {', '.join(x['a'])} el {x['cuando']}")
          for x in (h.get('ultimosFallos') or [])[-5:]:
              print(f"::error::AVISO QUE FALLÓ AL SALIR: «{x['asunto']}» — {x['error']}")
          d = h.get('diasSinEntregar')
          if d is not None and d >= 10:
              print(f'::error::el canal de avisos lleva {d} días sin entregar NADA. El informe es SEMANAL: esto no es que no haya noticias, es que no hay canal.')
          PY
              else
                echo "   /health/avisos devolvió HTTP ${AVI%% *} — ¿versión anterior desplegada?"
              fi
              exit 0
            fi

            [ "$intento" = "1" ] && sleep 30
          done

          # ── Falló. Antes de dar la alarma, ¿de quién es la culpa? ──
          echo ""
          echo "══ NodeFlow no contesta. Comprobando quién más está en pie ══"

          echo "· Internet del runner (Cloudflare):"
          RED=$(probar https://www.cloudflare.com/cdn-cgi/trace /tmp/cf.txt)
          contar "$RED"
          RED_OK=$([ "${RED%% *}" = "200" ] && echo si || echo no)

          echo "· Otro contenedor del MISMO servidor (ets.nodeflow.es):"
          HOST=$(probar https://ets.nodeflow.es/ /tmp/ets.html)
          contar "$HOST"
          HOST_OK=$([ "${HOST%% *}" = "200" ] && echo si || echo no)

          echo ""
          # Callarse SÓLO si no responde NADA de fuera. La primera versión de
          # esto se callaba en cuanto fallaba Cloudflare, y probándolo salió el
          # fallo: en la prueba Cloudflare no contestaba pero ets.nodeflow.es
          # sí — o sea que el runner tenía red de sobra, y aun así se iba a
          # callar. Un vigilante que se calla por el motivo equivocado es peor
          # que no tenerlo: da por vigilado lo que no ha mirado.
          if [ "$RED_OK" = "no" ] && [ "$HOST_OK" = "no" ]; then
            echo "⚠️  El runner no alcanza NADA de fuera, ni Cloudflare ni nuestro servidor:"
            echo "    es SU red, no la nuestra. No se da la alarma."
            echo "    Si esto se repite mucho, mirar el estado de GitHub Actions."
            echo "::warning::watchdog sin red en el runner — no concluyente"
            exit 0
          fi

          [ "$RED_OK" = "no" ] && echo "   (nota: Cloudflare no contestó, pero nuestro servidor sí — la red del runner va)"

          if [ "$HOST_OK" = "no" ]; then
            echo "🚨 CAÍDA DEL SERVIDOR: ni VoiceCore ni ETS Guard responden, y la red del"
            echo "   runner va bien. Está caída la máquina de EasyPanel o su proxy."
            echo "   Mirar: panel de EasyPanel (xmehd4.easypanel.host) y el estado del host."
          else
            echo "🚨 VOICECORE COLGADO: el servidor responde (ETS Guard va), pero VoiceCore no."
            echo "   El problema es del contenedor voicecore-api, no de la máquina."
            echo "   Mirar: logs y reinicios de voicecore/voicecore-api en EasyPanel."
          fi
          echo ""
          echo "   Mientras dure, las llamadas que entren se pierden: Telnyx no alcanza el webhook."
          exit 1
