# ══════════════════════════════════════════════════════════════════════════
# Vigilante EXTERNO de NodeFlow
#
# POR QUÉ: hasta hoy el servicio se vigilaba a sí mismo. La auditoría nocturna
# y el /health corren DENTRO del propio contenedor, así que el único fallo que
# no pueden detectar es justo el que importa: que el contenedor no esté vivo.
# Un vigilante que se apaga con lo vigilado no vigila.
#
# Esto corre en la infraestructura de GitHub, fuera de EasyPanel. Si falla,
# GitHub manda un correo al dueño del repo — sin cuentas nuevas ni secretos.
#
# LÍMITES, que conviene saberlos:
#   · El cron de Actions se retrasa (5-15 min es normal en horas punta). Detecta
#     caídas en ~15-25 min, no en uno. Para vigilancia al minuto hace falta algo
#     como UptimeRobot, que sí necesita darse de alta.
#   · GitHub desactiva los crons de repos sin actividad durante 60 días. Este
#     tiene despliegues casi a diario, pero si algún día para, revisar esto.
# ══════════════════════════════════════════════════════════════════════════
name: Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # para poder probarlo a mano sin esperar al cron

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ¿Está vivo y sano?
        run: |
          set -uo pipefail
          URL="https://nodeflow.es/health"

          # Dos intentos separados 30s: un redespliegue o un pico de red no son
          # una caída, y una alarma que salta por eso se acaba ignorando.
          for intento in 1 2; do
            echo "── Intento $intento ──"
            CODE=$(curl -s -m 25 -o /tmp/health.json -w '%{http_code}' "$URL" || echo "000")
            echo "HTTP $CODE"
            cat /tmp/health.json 2>/dev/null || true
            echo ""

            if [ "$CODE" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              # Vivo. Además, avisar de lo que está mal SIN tumbar el watchdog:
              # esto vigila que responda, no que la config sea perfecta.
              grep -q '"database":"connected"' /tmp/health.json || echo "::warning::la base de datos NO figura conectada"
              grep -q '"telnyxSignature":"enforced"' /tmp/health.json || echo "::warning::la firma de Telnyx no se está exigiendo"
              grep -q '"billingConfig":"ok"'      /tmp/health.json || echo "::error::billingConfig NO está ok — puede haber excedente que se cuenta y no se cobra"
              echo "✅ NodeFlow responde y se declara sano."
              exit 0
            fi

            [ "$intento" = "1" ] && sleep 30
          done

          echo ""
          echo "🚨 NodeFlow NO responde correctamente en $URL tras 2 intentos."
          echo "Último HTTP: $CODE"
          exit 1
