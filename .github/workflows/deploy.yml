name: Build & Deploy to EasyPanel

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/74doktorr-boop/voicecore

jobs:
  # ── PUERTA DE CALIDAD (auditoría 2026-07-29, F1) ────────────────────────────
  # Hasta ahora la suite —casi 2.800 casos— NO se ejecutaba NUNCA: ni aquí ni en
  # el Dockerfile. Un commit que la rompiera entera llegaba a producción sin
  # ninguna fricción. Era la deuda estructural más cara del repo: mucho test
  # escrito que no protegía nada.
  #
  # La suite no necesita credenciales ni red (se comprobó ejecutándola sin .env),
  # así que este job es rápido y determinista. Si falla, NO se construye ni se
  # despliega.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # igual que el Dockerfile
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Va ANTES de los tests: un `require` no declarado no lo cazan los tests
      # (en local Node encuentra el paquete subiendo por el árbol de carpetas),
      # solo revienta dentro del contenedor. Así fue lo de jszip.
      - name: Dependencias declaradas
        run: npm run deps:check

      - name: Suite de tests
        run: npm test

  build-and-deploy:
    needs: test                        # sin verde no se despliega
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/74doktorr-boop/voicecore:latest
            ghcr.io/74doktorr-boop/voicecore:${{ github.sha }}

      - name: Deploy to EasyPanel
        run: |
          set +e  # gestionamos los errores a mano; la imagen ya está a salvo en GHCR

          # NUESTRO dominio, no el del proveedor. El 02/08 `easypanel.host`
          # apareció APARCADO y en venta: su nombre dejó de apuntar a nuestro
          # servidor y con él se cayó todo el plano de control. Los despliegues
          # se quedaron bloqueados horas, y no por una avería nuestra — la
          # máquina estaba sirviendo perfectamente todo el rato.
          #
          # De paso se llevó por delante `begira.nodeflow.es`, que era un CNAME
          # a ese mismo dominio y acabó sirviendo un anuncio de venta de
          # dominios con nuestra marca encima.
          #
          # La regla que queda: **nada nuestro puede depender del nombre de un
          # tercero.** Ni un webhook, ni un CNAME, ni el despliegue.
          EP="https://panel.nodeflow.es"
          AUTH="Authorization: Bearer ${{ secrets.EASYPANEL_TOKEN }}"
          IMG="ghcr.io/74doktorr-boop/voicecore:${{ github.sha }}"

          # 1. Fijar la nueva imagen. VENTANA DE 25 MINUTOS, y el número no es arbitrario.
          #
          # El 01/08 este paso murió tras 10 intentos: el anfitrión de EasyPanel
          # estuvo inalcanzable DESDE LOS RUNNERS DE GITHUB de 15:43 a 15:49 —
          # seis minutos— y la ventana de reintentos era de cinco. Por un minuto.
          #
          # Y lo que hacía falta saber para dimensionarla: a esa MISMA hora, desde
          # otra red, nodeflow.es y ets.nodeflow.es respondían en 0,1 s, y el
          # proceso no perdió un solo latido. O sea que el servidor estaba
          # sirviendo y lo que falla es la ruta desde aquí. Esa clase de corte se
          # arregla sola; solo hay que esperarla.
          #
          # 25 minutos con espera creciente (15s → 60s) cubre cuatro veces el
          # corte más largo medido, y no cuesta nada cuando todo va bien: en el
          # caso normal el primer intento devuelve 200 y el bucle sale.
          echo "→ Fijando imagen del servicio (reintentos hasta ~25 min)…"
          STATUS=000
          ESPERA=15
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /tmp/upd.txt -w "%{http_code}" \
              --connect-timeout 15 --max-time 40 \
              -X POST "$EP/api/trpc/services.app.updateSourceImage" \
              -H "Content-Type: application/json" -H "$AUTH" \
              -d "{\"json\":{\"projectName\":\"voicecore\",\"serviceName\":\"voicecore-api\",\"image\":\"$IMG\"}}")
            echo "   intento $i → HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            # Un 401/403 NO se arregla esperando: es el token, y reintentar
            # treinta veces contra su API solo retrasa el diagnóstico media hora.
            case "$STATUS" in
              401|403) echo "::error::EasyPanel rechaza las credenciales (HTTP $STATUS). Revisa EASYPANEL_TOKEN — esperar no lo arregla."; exit 1 ;;
            esac
            if [ $i -lt 30 ]; then
              sleep $ESPERA
              [ $ESPERA -lt 60 ] && ESPERA=$((ESPERA + 5))
            fi
          done
          cat /tmp/upd.txt 2>/dev/null; echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::EasyPanel no respondió en 25 minutos (HTTP $STATUS)."
            echo "La imagen $IMG está en GHCR, así que no se ha perdido nada: re-lanza este workflow."
            echo ""
            echo "Si esto se repite, NO des por hecho que el servidor está caído: el 01/08"
            echo "pasó tres veces y las tres estaba sirviendo con normalidad desde otras"
            echo "redes. Compruébalo antes de tocar nada:"
            echo "  curl -s https://nodeflow.es/health          # ¿responde desde tu casa?"
            echo "  curl -s https://nodeflow.es/health/latidos   # ¿perdió algún latido?"
            exit 1
          fi
          echo "   ✓ Imagen fijada."

          sleep 2

          # 2. VENTANA TRANQUILA: no reiniciar el contenedor con llamadas dentro.
          #    Caso real (2026-07-03 02:05): un deploy mató una llamada en vivo —
          #    el cliente oyó otra vez el saludo inicial en mitad de su
          #    cancelación y la fila quedó huérfana ("1989 minutos"). Se espera
          #    hasta 5 min a que /health reporte activeCalls=0; si no se despeja
          #    o /health no responde, se despliega igual (un deploy jamás queda
          #    bloqueado para siempre).
          echo "→ Esperando ventana sin llamadas activas (máx. 5 min)…"
          for i in $(seq 1 20); do
            ACTIVE=$(curl -sS --connect-timeout 10 --max-time 15 https://nodeflow.es/health | grep -o '"activeCalls":[0-9]*' | cut -d: -f2)
            if [ -z "$ACTIVE" ]; then echo "   /health no responde — seguimos"; break; fi
            if [ "$ACTIVE" = "0" ]; then echo "   ✓ Sin llamadas activas."; break; fi
            echo "   $ACTIVE llamada(s) en curso — espera $i/20 (15s)"
            sleep 15
          done

          # 3. Disparar el deploy. EasyPanel mantiene la conexión abierta mientras
          #    descarga+reinicia, así que un timeout aquí es NORMAL: el deploy
          #    continúa en el servidor. Lo intentamos un par de veces y toleramos timeout.
          echo "→ Disparando deploy…"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 15 --max-time 45 \
              -X POST "$EP/api/trpc/services.app.deployService" \
              -H "Content-Type: application/json" -H "$AUTH" \
              -d '{"json":{"projectName":"voicecore","serviceName":"voicecore-api"}}')
            echo "   deployService intento $i → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            [ $i -lt 3 ] && sleep 10
          done

          echo "✅ Deploy disparado. La imagen quedó fijada correctamente."
