  DESPUBLICADA — auditoría 2026-07-29.

  Esta era una landing huérfana que seguía viva, indexable (robots: index,follow)

   · "Tus clientes hablan con naturalidad, SIN NOTAR QUE ES UNA IA" — choca de
     frente con lo que dicen las Condiciones ("se presenta como asistente
     virtual y nunca afirma ser una persona") y con el art. 50 del Reglamento
     (UE) 2024/1689 (AI Act), que obliga a informar de que se está interactuando
     con un sistema de IA.
   · "0,3s" de respuesta: físicamente inalcanzable con la cadena
     Telnyx → Deepgram → LLM → TTS. La página actual dice <700ms y otra <2s: tres
     cifras contradictorias en el mismo dominio.
   · Integraciones con Instagram, Gmail y Google Sheets anunciadas como hechas:
     Instagram no tiene NI UNA referencia en el código; de Gmail solo hay un
     comentario sobre agrupación de asuntos; src/utils/sheets.js existe pero no
     lo requiere nadie.
   · Precios y planes anteriores al reposicionamiento.

  Se deja como redirección permanente a /recepcion (la página viva) en vez de
  borrarla, para no romper enlaces externos que puedan apuntar aquí.
-->
